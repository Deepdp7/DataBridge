[package]
name = "databridge"
version = "0.1.0"
description = "DataBridge — Windows Desktop Market Data Bridge for AmiBroker"
authors = ["DataBridge Engineering"]
edition = "2021"
rust-version = "1.80"

[lib]
# The `_lib` suffix is necessary on Windows to avoid name conflicts with the bin.
name = "databridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# ──────────────────────────────────────────────
# Build dependencies
# ──────────────────────────────────────────────
[build-dependencies]
tauri-build = { version = "2", features = [] }

# ──────────────────────────────────────────────
# Runtime dependencies
# ──────────────────────────────────────────────
[dependencies]
# Tauri 2 core
tauri = { version = "2", features = [
    "tray-icon",
    "image-ico",
    "image-png",
] }
tauri-plugin-opener        = "2"
tauri-plugin-shell         = "2"
tauri-plugin-notification  = "2"
tauri-plugin-autostart     = "2"
tauri-plugin-store         = "2"

# Async runtime
tokio = { version = "1", features = [
    "full",
    "tracing",
] }

# HTTP client (REST calls to broker API)
reqwest = { version = "0.12", features = [
    "json",
    "rustls-tls",
    "gzip",
    "stream",
], default-features = false }

# WebSocket (broker WebSocket feed)
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

# Local IPC server (REST + WebSocket for UI and AmiBroker plugin)
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# SQLite (async, compile-time checked queries)
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls",
    "sqlite",
    "macros",
    "migrate",
    "chrono",
    "json",
] }

# Serialization
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"

# Time and timezone
chrono     = { version = "0.4", features = ["serde"] }
chrono-tz  = { version = "0.10", features = ["serde"] }

# Logging / tracing
tracing              = "0.1"
tracing-subscriber   = { version = "0.3", features = ["env-filter", "json", "chrono"] }

# Rate limiting (token bucket for broker API rate limits)
governor = "0.7"
nonzero_ext = "0.3"

# CSV parsing (symbol import)
csv = "1"

# Error handling
thiserror  = "2"
anyhow     = "1"

# Utilities
uuid        = { version = "1", features = ["v4", "serde"] }
once_cell   = "1"
async-trait = "0.1"
bytes       = "1"
parking_lot = "0.12"
dashmap     = "6"
indexmap    = { version = "2", features = ["serde"] }

# Windows-specific: Credential Manager (DPAPI) for secure credential storage
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
    "Win32_System_Registry",
    "Win32_UI_Shell",
] }

# ──────────────────────────────────────────────
# Dev dependencies
# ──────────────────────────────────────────────
[dev-dependencies]
tokio-test  = "0.4"
tempfile    = "3"
mockito     = "1"

# ──────────────────────────────────────────────
# Release profile (size + performance)
# ──────────────────────────────────────────────
[profile.release]
codegen-units = 1
lto           = true
opt-level     = 3
panic         = "abort"
strip         = true

# ──────────────────────────────────────────────
# Dev profile (faster builds)
# ──────────────────────────────────────────────
[profile.dev]
opt-level = 0
debug     = true
